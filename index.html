<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Folio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#000; --s1:#0e0e0f; --s2:#1a1a1c; --s3:#26262a; --line:#232326;
  --text:#f5f5f7; --muted:#9a9aa0; --dim:#5d5d63;
  --x:#ff2d55; --heart:#ff3040; --ok:#30d158;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hidden{display:none!important}

/* privacy cover when app is backgrounded */
#cover{position:fixed;inset:0;background:#000;z-index:999;display:none}
body.covered #cover{display:block}

/* ---------- header ---------- */
#app{min-height:100%}
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);padding:calc(var(--sat) + 6px) 14px 0}
.hrow{display:flex;align-items:center;height:46px;gap:4px}
.brand{font-size:24px;font-weight:700;letter-spacing:-.6px;flex:1}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:20px}
.ibtn:active{background:var(--s2)}
.xpill{height:30px;min-width:38px;padding:0 10px;border-radius:15px;border:1.5px solid var(--dim);color:var(--muted);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;margin-right:4px;transition:.15s}
.xpill.on{border-color:var(--x);color:#fff;background:var(--x)}
.xpill.only{border-color:var(--x);color:var(--x);background:rgba(255,45,85,.12)}
.xpill small{font-size:10px;font-weight:800;letter-spacing:.6px}

.bar{display:flex;align-items:center;gap:8px;padding:6px 0 10px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:2px;flex:none}
.seg button{width:36px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.seg button.act{background:var(--s3);color:var(--text)}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--s2);color:var(--text);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.act{background:var(--text);color:#000}
.chip .x{opacity:.7;margin-left:2px}
.chip.fav.act{background:var(--heart);color:#fff}
.sortsel{flex:none;margin-left:auto;height:32px;border-radius:16px;background:var(--s2);color:var(--muted);border:0;padding:0 12px;font:inherit;font-size:13px;-webkit-appearance:none;appearance:none}

/* ---------- profile / stats ---------- */
.profile{display:flex;align-items:center;gap:16px;padding:14px 16px 16px}
.avatar{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3a3a40,#16161a);border:2px solid var(--s3)}
.avatar.tag{font-size:34px;font-weight:400}
.pname{font-size:20px;font-weight:700;letter-spacing:-.3px;word-break:break-word}
.pstats{display:flex;gap:16px;margin-top:6px;color:var(--muted);font-size:13px}
.pstats b{color:var(--text);font-weight:600}
.plink{margin-top:8px;font-size:13px;color:var(--muted);text-decoration:underline}

/* ---------- grid ---------- */
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:1;background:var(--s1);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.tile img.ld{opacity:1}
.tile .ic{position:absolute;top:7px;right:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .dur{position:absolute;bottom:6px;left:7px;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.8);display:flex;align-items:center;gap:3px}
.tile .xb{position:absolute;top:7px;left:7px;background:var(--x);color:#fff;font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px}
.tile .fv{position:absolute;bottom:6px;right:7px}
.tile:active{opacity:.75}

/* ---------- feed ---------- */
#feed{max-width:640px;margin:0 auto}
.fpost{padding-bottom:18px}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(135deg,#3a3a40,#16161a);flex:none}
.fwho{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwho span{cursor:pointer}
.fwho .sub{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* ---------- carousel (shared by feed + viewer) ---------- */
.car{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;display:grid;place-items:center;background:#000;overflow:hidden}
.fpost .slide{aspect-ratio:4/5}
.slide img,.slide video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.slide .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.slide .play{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
.slide .sxb{position:absolute;top:10px;left:10px;background:var(--x);color:#fff;font-size:11px;font-weight:800;padding:3px 6px;border-radius:6px;z-index:2}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);font-size:12px;font-weight:600;padding:3px 9px;border-radius:12px;z-index:2}
.dots{display:flex;justify-content:center;gap:4px;padding:10px 0 2px;min-height:18px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--dim);transition:.2s}
.dots i.on{background:#fff;width:14px}
.acts{display:flex;align-items:center;gap:6px;padding:0 8px}
.acts .sp{flex:1}
.meta{padding:2px 14px 0;font-size:14px}
.meta .date{color:var(--muted);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.3px}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.tags a{color:#8ab4ff;cursor:pointer}
.creators a{font-weight:600;cursor:pointer;margin-right:8px}
.xbadge{background:var(--x);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}

/* ---------- viewer ---------- */
body.fs{overflow:hidden}
body.fs header{position:fixed;left:0;right:0;top:0;background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,0));-webkit-backdrop-filter:none;backdrop-filter:none;pointer-events:none}
body.fs header .hrow,body.fs header .bar{pointer-events:auto}
body.fs .profile{display:none}
body.fs #feed{max-width:none;margin:0;height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
body.fs #feed::-webkit-scrollbar{display:none}
body.fs .fpost{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;padding:0;position:relative;overflow:hidden}
body.fs .fpost .car{position:absolute;inset:0}
body.fs .fpost .track{height:100%}
body.fs .fpost .slide{aspect-ratio:auto!important;height:100%}
body.fs .fpost .fhead{position:absolute;left:0;right:0;top:calc(var(--sat) + 104px);z-index:3}
body.fs .fsinfo{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:46px 4px calc(var(--sab) + 6px);background:linear-gradient(transparent,rgba(0,0,0,.9));pointer-events:none}
body.fs .fsinfo>*{pointer-events:auto}
body.fs .fsinfo .dots{padding-bottom:6px}
body.fs .snd{position:absolute;right:14px;bottom:calc(var(--sab) + 128px);z-index:4;width:44px;height:44px;border-radius:22px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center}
#viewer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#viewer.open{transform:none}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 4px) 8px 4px;flex:none}
.vbar .fwho{font-size:15px}
#viewer .car{flex:1;min-height:0;display:flex;flex-direction:column}
#viewer .track{flex:1;min-height:0}
#viewer .slide{height:100%}
.vfoot{flex:none;padding-bottom:calc(var(--sab) + 10px)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--s1);border-radius:18px 18px 0 0;padding:8px 16px calc(var(--sab) + 16px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:0 auto 12px}
.sheet h3{margin:4px 0 14px;font-size:17px;text-align:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;background:var(--s2);margin-bottom:8px;text-align:left}
.opt .t{font-weight:600}
.opt .d{color:var(--muted);font-size:13px;margin-top:2px}
.opt .rad{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex:none}
.opt.sel .rad{border:7px solid var(--x)}
.opt.danger{color:var(--heart)}

/* full-screen pages (editor, search, settings) */
.page{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.page.open{transform:none}
.page.up{transform:translateY(100%)}
.page.up.open{transform:none}
.ptop{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 12px 8px;border-bottom:1px solid var(--line);flex:none}
.ptop h2{flex:1;text-align:center;font-size:16px;margin:0}
.tbtn{font-weight:600;padding:8px 6px;min-width:60px}
.tbtn.pri{color:#4ea1ff;text-align:right}
.tbtn:disabled{opacity:.35}
.pbody{flex:1;overflow-y:auto;padding:14px 16px calc(var(--sab) + 30px);-webkit-overflow-scrolling:touch}

.lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:22px 4px 8px}
.card{background:var(--s1);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:50px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:13px}
.row .val{color:var(--muted)}
button.row:active{background:var(--s2)}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--s3);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sw.on{background:var(--x)}
.sw.on::after{transform:translateX(20px)}
.sw.green.on{background:var(--ok)}

/* editor media strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--s2)}
.mi img{width:100%;height:100%;object-fit:cover}
.mi.isx img{filter:brightness(.55)}
.mi .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:5px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.mi .ctl button{width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:12px;font-weight:800}
.mi .ctl button.xon{background:var(--x)}
.mi .del{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.6);display:grid;place-items:center}
.mi .num{position:absolute;top:5px;left:6px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.mi .vd{position:absolute;top:30px;left:6px;font-size:11px;font-weight:600;text-shadow:0 1px 2px #000}
.mi.add{display:grid;place-items:center;border:1.5px dashed var(--s3);background:transparent;color:var(--muted);font-size:13px;text-align:center}
.mi.busy{display:grid;place-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--s3);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{color:var(--muted);font-size:12px;margin:8px 4px 0;line-height:1.4}

/* chip input */
.cin{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--s1);border-radius:var(--r);min-height:50px;align-items:center}
.cin .c{display:flex;align-items:center;gap:4px;background:var(--s3);border-radius:14px;padding:5px 8px 5px 11px;font-size:14px}
.cin .c button{width:18px;height:18px;display:grid;place-items:center;opacity:.7}
.cin input{flex:1;min-width:110px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:5px 4px}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs button{flex:none;background:var(--s2);border-radius:14px;padding:6px 11px;font-size:13px;color:var(--muted)}
.field{width:100%;background:var(--s1);border:0;border-radius:var(--r);padding:14px;color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;min-height:50px}
.field::-webkit-date-and-time-value{text-align:left}

/* search */
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:12px;padding:0 12px;height:40px}
.sbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.res{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left}
.res .n{font-weight:600}
.res .c2{color:var(--muted);font-size:13px}
.res:active{background:var(--s1);border-radius:10px}
.rtag{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--s3);display:grid;place-items:center;font-size:20px;flex:none}
.res .mini{width:44px;height:44px;font-size:18px}

/* empty */
.empty{text-align:center;color:var(--muted);padding:80px 30px}
.empty .big{width:80px;height:80px;border-radius:50%;border:2px solid var(--s3);display:grid;place-items:center;margin:0 auto 18px}
.empty h4{color:var(--text);font-size:20px;margin:0 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;background:#fff;color:#000;font-weight:600;margin-top:18px}
.btn.sec{background:var(--s2);color:var(--text)}
.btn.wide{width:100%}

/* ---------- lock / pin ---------- */
.pinwrap{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 20px)}
.pinwrap.over{z-index:90;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.plogo{width:58px;height:58px;border-radius:16px;margin-bottom:18px}
.ptitle{font-size:20px;font-weight:600;text-align:center}
.psub{color:var(--muted);font-size:14px;margin-top:6px;text-align:center;min-height:20px;max-width:300px}
.psub.err{color:var(--heart)}
.pdots{display:flex;gap:14px;margin:26px 0 34px;height:14px}
.pdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--muted);transition:.12s}
.pdots i.f{background:#fff;border-color:#fff}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:var(--s2);font-size:30px;font-weight:400;display:grid;place-items:center}
.key:active{background:#3a3a3e}
.key.ghost{background:transparent;font-size:16px;color:var(--muted)}
.key.ghost:active{background:transparent;color:#fff}
.pnext{margin-top:22px;height:22px}

/* toast + progress */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,20px);background:#2c2c30;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.prog{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.75);display:grid;place-items:center}
.prog .box{background:var(--s2);border-radius:16px;padding:22px 26px;min-width:240px;text-align:center}
.prog .barp{height:6px;border-radius:3px;background:var(--s3);margin-top:14px;overflow:hidden}
.prog .barp i{display:block;height:100%;background:#fff;width:0;transition:width .2s}
.prog .pt{font-size:13px;color:var(--muted);margin-top:8px}
.tile .ck{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center}
.tile .ck svg{opacity:0}
.tile.sel .ck{background:#4ea1ff;border-color:#4ea1ff}
.tile.sel .ck svg{opacity:1}
.tile.sel img.ld{opacity:.55}
body.selecting main{padding-bottom:calc(var(--sab) + 80px)}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,20,22,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 12px calc(var(--sab) + 10px);display:flex;gap:8px;align-items:center}
#selbar .cnt{flex:1;text-align:center;font-size:14px;font-weight:600}
#selbar button{height:38px;padding:0 14px;border-radius:12px;font-weight:600;background:var(--s2)}
#selbar button.pri{background:#fff;color:#000}
#selbar button:disabled{opacity:.35}
.meta .notes{white-space:pre-wrap;word-break:break-word;margin-bottom:4px}
textarea.field{min-height:84px}
body.selecting #toast{bottom:calc(var(--sab) + 84px)}
</style>
</head>
<body>
<div id="cover"></div>

<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <div class="brand" id="brand">Folio</div>
      <button class="xpill" id="xbtn" aria-label="X content">X</button>
      <button class="ibtn" id="searchBtn" aria-label="Search"></button>
      <button class="ibtn" id="addBtn" aria-label="New post"></button>
      <button class="ibtn" id="menuBtn" aria-label="Settings"></button>
    </div>
    <div class="bar" id="bar"></div>
  </header>
  <div id="profile"></div>
  <main>
    <div id="grid"></div>
    <div id="feed" class="hidden"></div>
    <div id="empty" class="hidden"></div>
  </main>
</div>

<div id="viewer"></div>
<div id="toast"></div>
<input type="file" id="filePick" accept="image/*,video/*" multiple class="hidden">
<input type="file" id="backupPick" multiple class="hidden">

<script>
"use strict";
/* =========================================================
   Folio — private photo & video organizer (runs fully offline)
   Data lives only in this app's storage on the device.
   ========================================================= */

const VERSION = '2.2.0';

/* ---------- icons ---------- */
const I = {

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('folio2', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('posts', { keyPath: 'id' });   // {id, d: encrypted post}
        d.createObjectStore('media');                       // "itemId/chunk" -> encrypted chunk
        d.createObjectStore('thumbs');                      // itemId -> encrypted thumbnail
        d.createObjectStore('meta');                        // wrapped key, view settings, failed tries
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const s = t.objectStore(store);
      let out; const r = fn(s);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Storage aborted (phone may be out of space)'));
    });
  },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, v, k) { return this.tx(store, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  delPrefix(store, p) { return this.tx(store, 'readwrite', s => s.delete(IDBKeyRange.bound(p, p + '￿'))); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
};

/* ---------- encryption ----------
   One random AES-256 key encrypts everything: posts (creators, tags, notes), thumbnails,
   photos and videos. That key is saved only in wrapped (encrypted) form, locked with a key
   derived from your passcode (PBKDF2-SHA256, 600,000 rounds). It exists in memory only
   while Folio is unlocked. Forgetting the passcode means the library can't be opened. */
const enc = new TextEncoder(), dec = new TextDecoder();
const KDF_ITER = 600000;
const CHUNK = 2 * 1024 * 1024;   // videos are stored as encrypted 2 MB pieces
let DK = null;                   // data key, only while unlocked
let keyRec = null;               // {kid, salt, iter, iv, wrapped, kind:'pin'|'pass', len}
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function kekFrom(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(salt), iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
async function wrapDK(dk, pass) {
  const salt = b64e(rand(16)), iv = rand(12);
  const kek = await kekFrom(pass, salt, KDF_ITER);
  const w = await crypto.subtle.wrapKey('raw', dk, kek, { name: 'AES-GCM', iv });
  return { salt, iter: KDF_ITER, iv: b64e(iv), wrapped: b64e(new Uint8Array(w)) };
}
async function unwrapDK(rec, pass) {
  try {
    const kek = await kekFrom(pass, rec.salt, rec.iter);
    return await crypto.subtle.unwrapKey('raw', b64d(rec.wrapped), kek, { name: 'AES-GCM', iv: b64d(rec.iv) }, { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
  } catch { return null; }
}
async function sealBuf(buf, k = DK) {
  if (!k) throw new Error('Folio is locked');
  const iv = rand(12);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, buf));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function openBuf(buf, k = DK) {
  if (!k) throw new Error('Folio is locked');
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, k, u.subarray(12));
}
const sealBlob = async (buf, k) => new Blob([await sealBuf(buf, k)]);
const openBlob = async (blob, k) => openBuf(await blob.arrayBuffer(), k);

async function savePost(p) { await DB.put('posts', { id: p.id, d: await sealBlob(enc.encode(JSON.stringify(p))) }); }
async function loadPosts() {
  const out = [];
  for (const r of (await DB.all('posts')) || []) {
    try { out.push(JSON.parse(dec.decode(await openBlob(r.d)))); } catch {}
  }
  return out;
}
async function storeItem(it, onp) {
  const f = it._file; let n = 0;
  for (let o = 0; o < f.size || n === 0; o += CHUNK) {
    await DB.put('media', await sealBlob(await f.slice(o, o + CHUNK).arrayBuffer()), `${it.id}/${n}`);
    n++;
    if (onp) onp(f.size ? Math.min(1, (o + CHUNK) / f.size) : 1);
  }
  await DB.put('thumbs', await sealBlob(await it._thumb.arrayBuffer()), it.id);
  it.n = n; it.size = f.size;
  it.mime = f.type || (it.type === 'video' ? 'video/mp4' : 'image/jpeg');
}
async function readMedia(it) {
  const parts = [];
  for (let i = 0; i < (it.n || 1); i++) {
    const b = await DB.get('media', `${it.id}/${i}`);
    if (!b) throw new Error('Missing file data');
    parts.push(await openBlob(b));

const fKey = f => f.type === 'tag' ? tagNorm(f.value) : key(f.value);
function fLabel(f) {
  if (f.type === 'tag') return '#' + tagNorm(f.value);
  if (f.type === 'text') return '“' + norm(f.value) + '”';
  if (f.type === 'missing') return f.value === 'tags' ? 'No tags' : 'No creator';
  return norm(f.value);
}
function fMatch(f, p) {
  const k = fKey(f);
  if (f.type === 'tag') return p.tags.some(t => tagNorm(t) === k);
  if (f.type === 'creator') return p.creators.some(c => key(c) === k);
  if (f.type === 'text') return (p.notes || '').toLowerCase().includes(k);
  if (f.type === 'missing') return f.value === 'tags' ? !p.tags.length : !p.creators.length;

/* ---------- passcode screens ----------

          alt:{label, fn}, onSubmit(value, ui) -> true | false | 'error message'} */
const logo = () => h('img', { class: 'plogo', src: 'icon-180.png', alt: '' });
function pinPad(opts) {
  let val = '', busy = false;
  const min = opts.min || 6;
  const wrap = h('div', { class: 'pinwrap' + (opts.over ? ' over' : '') });
  const dots = h('div', { class: 'pdots' });
  const sub = h('div', { class: 'psub' }, opts.sub || '');
  const title = h('div', { class: 'ptitle' }, opts.title);
  const next = h('div', { class: 'pnext' });
  const drawDots = () => {
    const n = opts.len || Math.max(min, val.length);
    dots.innerHTML = '';
    for (let i = 0; i < n; i++) dots.append(h('i', { class: i < val.length ? 'f' : '' }));
    next.innerHTML = '';

  };

    if (navigator.vibrate) navigator.vibrate(80);

  };

    if (busy) return; busy = true;
    const prev = sub.textContent; sub.textContent = 'Checking…'; sub.classList.remove('err');
    const r = await opts.onSubmit(val, ui);
    busy = false;
    if (r === true) { wrap.remove(); return; }
    if (sub.textContent === 'Checking…') sub.textContent = prev;
    if (typeof r === 'string') fail(r);
  }
  const press = d => {
    if (busy) return;
    if (d === 'del') { val = val.slice(0, -1); drawDots(); return; }
    if (val.length >= 12) return;

    if (opts.len && val.length === opts.len) setTimeout(submit, 90);

  keys.append(h('button', { class: 'key', onclick: () => press('0') }, '0'));
  keys.append(h('button', { class: 'key ghost', onclick: () => press('del'), 'aria-label': 'Delete', html: I.del }));
  wrap.append(logo(), title, sub, dots, keys, next);
  if (opts.alt) wrap.append(h('button', { class: 'plink', style: 'margin-top:14px', onclick: () => { wrap.remove(); opts.alt.fn(); } }, opts.alt.label));
  drawDots();

}
function textPad(opts) {
  let busy = false;
  const min = opts.min || 8;
  const wrap = h('div', { class: 'pinwrap' + (opts.over ? ' over' : '') });
  const title = h('div', { class: 'ptitle' }, opts.title);
  const sub = h('div', { class: 'psub' }, opts.sub || '');
  const inp = h('input', { type: 'password', class: 'field', style: 'max-width:320px;margin:26px 0 14px;background:var(--s2);text-align:center', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'go', 'aria-label': 'Password' });
  const fail = msg => {
    sub.textContent = msg; sub.classList.add('err');
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    inp.value = ''; inp.focus();
  };
  const ui = { setTitle: t => { title.textContent = t; }, setSub: s => { sub.textContent = s; sub.classList.remove('err'); }, reset: () => { inp.value = ''; inp.focus(); } };
  async function submit() {
    if (busy) return;
    const v = inp.value;

    busy = true;
    const prev = sub.textContent; sub.textContent = 'Checking…'; sub.classList.remove('err');
    const r = await opts.onSubmit(v, ui);
    busy = false;
    if (r === true) { wrap.remove(); return; }
    if (sub.textContent === 'Checking…') sub.textContent = prev;
    if (typeof r === 'string') fail(r);

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  wrap.append(logo(), title, sub, inp, h('button', { class: 'btn', style: 'margin:0;min-width:200px', onclick: submit }, 'Continue'));
  if (opts.onCancel) wrap.append(h('button', { class: 'btn sec', style: 'margin-top:10px;min-width:200px', onclick: () => { wrap.remove(); opts.onCancel(); } }, 'Cancel'));
  if (opts.alt) wrap.append(h('button', { class: 'plink', style: 'margin-top:18px', onclick: () => { wrap.remove(); opts.alt.fn(); } }, opts.alt.label));
  document.body.append(wrap);

const passPrompt = o => o.kind === 'pass' ? textPad(o) : pinPad(o);

let fails = { count: 0, until: 0 };   // survives reloads, so the wait can't be skipped
function askPass(title, over, onCancel) {
  return new Promise(resolve => passPrompt({
    kind: keyRec.kind, len: keyRec.len, min: keyRec.kind === 'pass' ? 1 : 6, title, over,
    sub: over ? 'Enter your passcode' : '',
    onCancel: onCancel ? () => { onCancel(); resolve(false); } : null,
    onSubmit: async pass => {
      if (Date.now() < fails.until) return `Too many tries. Wait ${Math.ceil((fails.until - Date.now()) / 1000)}s`;
      const dk = await unwrapDK(keyRec, pass);
      if (dk) {
        DK = dk;
        if (fails.count) { fails = { count: 0, until: 0 }; DB.put('meta', fails, 'fails'); }
        resolve(true); return true;
      }
      fails.count++;
      if (fails.count >= 5) fails.until = Date.now() + 30000 * 2 ** Math.min(fails.count - 5, 6);
      DB.put('meta', fails, 'fails');
      return fails.count >= 5 ? `Too many tries. Wait ${Math.ceil((fails.until - Date.now()) / 1000)}s` : 'Wrong passcode';
    }
  }));
}
/* o: {title, over, onCancel, warn, onDone(value, kind)} */
function createPass(o) {
  let kind = 'pin';
  const start = () => {
    let first = null;
    const isPin = kind === 'pin';
    passPrompt({
      kind, title: o.title, over: o.over, onCancel: o.onCancel, min: isPin ? 6 : 8,
      sub: (isPin ? 'Use 6–12 digits.' : 'Use at least 8 characters.') + (o.warn ? ' It can’t be reset, so don’t forget it.' : ''),
      alt: { label: isPin ? 'Use a password instead' : 'Use a number passcode instead', fn: () => { kind = isPin ? 'pass' : 'pin'; start(); } },
      onSubmit: async (v, ui) => {
        if (first === null) { first = v; ui.setTitle('Confirm it'); ui.setSub('Enter it again'); ui.reset(); return false; }
        if (v !== first) { first = null; ui.setTitle(o.title); return 'They didn’t match. Try again'; }
        await o.onDone(v, kind); return true;
      }
    });
  };
  start();
}

      keyRec = { ...(await wrapDK(DK, v)), kid: uid(), kind, len: kind === 'pin' ? v.length : 0 };

/* ---------- chip input ---------- */
function chipInput(initialVals, kind, placeholder) {
  let vals = [...initialVals];
  const wrap = h('div');
  const box = h('div', { class: 'cin' });
  const inp = h('input', { placeholder, autocomplete: 'off', autocorrect: 'off', autocapitalize: kind === 'tag' ? 'off' : 'words', spellcheck: 'false', enterkeyhint: 'done' });
  const sugs = h('div', { class: 'sugs' });
  const k = v => kind === 'tag' ? tagNorm(v) : key(v);
  const add = v => {
    v = kind === 'tag' ? tagNorm(v) : norm(v);
    if (!v) return;
    const known = indexOf(kind, posts).find(s => k(s.name) === k(v));   // reuse existing spelling
    if (known) v = known.name;
    if (!vals.some(x => k(x) === k(v))) vals.push(v);
    inp.value = ''; draw();
  };
  const draw = () => {
    box.querySelectorAll('.c').forEach(e => e.remove());
    vals.forEach(v => box.insertBefore(h('span', { class: 'c' }, kind === 'tag' ? '#' + v : v,
      h('button', { html: I.close, 'aria-label': 'Remove', onclick: () => { vals = vals.filter(x => x !== v); draw(); } })), inp));
    drawSugs();
  };
  const drawSugs = () => {
    const q = inp.value.trim().replace(/^#/, '').toLowerCase();
    sugs.innerHTML = '';
    const all = indexOf(kind, posts.filter(p => visItems(p).length || !hasX(p)))
      .filter(s => !vals.some(v => k(v) === k(s.name)) && (!q || s.name.toLowerCase().includes(q))).slice(0, 15);
    all.forEach(s => sugs.append(h('button', { onmousedown: e => e.preventDefault(), onclick: () => { add(s.name); inp.focus(); } }, kind === 'tag' ? '#' + s.name : s.name)));
    sugs.classList.toggle('hidden', !all.length);
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(inp.value); }
    else if (e.key === 'Backspace' && !inp.value && vals.length) { vals.pop(); draw(); setTimeout(() => inp.focus()); }
  });
  inp.addEventListener('input', () => {
    if (inp.value.includes(',')) { inp.value.split(',').forEach(add); return; }
    drawSugs();
  });
  inp.addEventListener('blur', () => { setTimeout(() => { if (inp.value.trim() && document.activeElement !== inp) add(inp.value); }, 150); });
  box.addEventListener('click', e => { if (e.target === box) inp.focus(); });
  box.append(inp);
  draw();
  wrap.append(box, sugs);
  wrap.values = () => { if (inp.value.trim()) add(inp.value); return vals; };
  return wrap;
}

/* ---------- media processing ---------- */
function loadImage(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
function canvasBlob(src, w, h, max = 480) {
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', 0.82));
}
async function imageInfo(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const thumb = await canvasBlob(img, img.naturalWidth, img.naturalHeight);
    return { thumb, w: img.naturalWidth, h: img.naturalHeight };
  } catch { return { thumb: null }; } finally { URL.revokeObjectURL(url); }
}
function videoInfo(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    let done = false;
    const finish = r => { if (done) return; done = true; v.removeAttribute('src'); v.load(); URL.revokeObjectURL(url); resolve(r); };
    v.onloadedmetadata = () => {
      const t = isFinite(v.duration) ? Math.min(1.5, v.duration * 0.1) : 0.5;
      try { v.currentTime = t; } catch { }
    };
    v.onseeked = async () => {
      try {
        const thumb = await canvasBlob(v, v.videoWidth, v.videoHeight);
        finish({ thumb, w: v.videoWidth, h: v.videoHeight, dur: v.duration });
      } catch { finish({ thumb: null, dur: v.duration }); }
    };
    v.onerror = () => finish({ thumb: null, dur: 0 });
    setTimeout(() => finish({ thumb: null, dur: isFinite(v.duration) ? v.duration : 0 }), 12000);
    v.src = url; v.load();
  });
}
function placeholderThumb(isVid) {
  const c = document.createElement('canvas'); c.width = c.height = 240;
  const g = c.getContext('2d'); g.fillStyle = '#1a1a1c'; g.fillRect(0, 0, 240, 240);
  g.fillStyle = '#5d5d63'; g.font = '600 26px -apple-system,sans-serif'; g.textAlign = 'center'; g.fillText(isVid ? 'VIDEO' : 'PHOTO', 120, 128);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

async function openEditor(postId) {
  const existing = postId ? posts.find(p => p.id === postId) : null;

  const removed = [];
  let postX = existing ? !!existing.x : xMode === 'only';

  const strip = h('div', { class: 'strip' });
  const dateIn = h('input', { type: 'date', class: 'field', value: existing ? (existing.date || '') : today(), onchange: () => dateTouched = true });
  const creators = chipInput(existing ? existing.creators : filters.filter(f => f.type === 'creator').map(f => norm(f.value)), 'creator', 'Add creator…');
  const tags = chipInput(existing ? existing.tags : filters.filter(f => f.type === 'tag').map(f => tagNorm(f.value)), 'tag', 'Add tag…');
  const notesIn = h('textarea', { class: 'field', rows: '3', placeholder: 'Anything worth remembering (optional)', style: 'resize:none;line-height:1.4;display:block' });
  notesIn.value = existing ? (existing.notes || '') : '';

  const thumbSrc = it => it._thumbURL || thumbURL.get(it.id) || '';

      const img = h('img', { alt: '' });

      const card = h('div', { class: 'mi' + (it.x || postX ? ' isx' : '') + (it._busy ? ' busy' : '') });
      if (it._busy) { card.append(h('div', { class: 'spin' })); strip.append(card); return; }
      card.append(img, h('div', { class: 'num' }, String(i + 1)));
      if (it.type === 'video') card.append(h('div', { class: 'vd' }, '▶ ' + fmtDur(it.dur)));
      card.append(h('button', { class: 'del', html: I.close, 'aria-label': 'Remove', onclick: () => { removed.push(...items.splice(i, 1).filter(x => !x._file)); drawStrip(); } }));
      card.append(h('div', { class: 'ctl' },
        h('button', { html: I.left, 'aria-label': 'Move left', style: i ? '' : 'visibility:hidden', onclick: () => { [items[i - 1], items[i]] = [items[i], items[i - 1]]; drawStrip(); } }),

        h('button', { html: I.right, 'aria-label': 'Move right', style: i < items.length - 1 ? '' : 'visibility:hidden', onclick: () => { [items[i + 1], items[i]] = [items[i], items[i + 1]]; drawStrip(); } })));

    saveBtn.disabled = !items.length || items.some(i => i._busy);
  };

  function pickFiles() {
    const fp = $('#filePick');
    fp.value = '';
    fp.onchange = async () => {
      const files = [...fp.files];
      if (!files.length) return;
      const added = files.map(f => ({ id: uid(), type: isVideo(f) ? 'video' : 'image', x: false, _file: f, _busy: true, name: f.name }));
      items.push(...added);

        else closePage('editor');

      h('div', { class: 'lbl' }, 'Options'),
      h('div', { class: 'card' },
        h('button', { class: 'row', onclick: () => { postX = !postX; xSw.classList.toggle('on', postX); drawStrip(); } },
          h('div', { class: 'grow' }, h('div', null, 'Whole post is X'), h('div', { class: 'sub' }, 'Hidden unless X is turned on')), xSw),
        h('button', { class: 'row', onclick: () => { fav = !fav; favSw.classList.toggle('on', fav); } },
          h('div', { class: 'grow' }, 'Favorite'), favSw)),
      existing ? h('button', { class: 'btn sec wide', style: 'color:var(--heart);margin-top:28px', onclick: () => confirmSheet('Delete post?', 'This removes the post and its photos/videos from Folio.', 'Delete', async () => { closePage('editor'); await deletePost(existing.id); }) }, 'Delete post') : null));
  drawStrip();
  openPage('editor', page, true);
  if (!existing) pickFiles();   // must run inside the tap so iOS opens the picker
}

function progress(title) {
  const bar = h('i'); const pt = h('div', { class: 'pt' });
  const el = h('div', { class: 'prog' }, h('div', { class: 'box' }, h('div', { style: 'font-weight:600' }, title), h('div', { class: 'barp' }, bar), pt));
  document.body.append(el);
  return { set: (f, t) => { bar.style.width = Math.round(f * 100) + '%'; if (t != null) pt.textContent = t; }, close: () => el.remove(), hide: () => { el.style.display = 'none'; }, show: () => { el.style.display = ''; }, title: t => el.querySelector('.box > div').textContent = t };
}

/* ---------- rename / merge creators & tags ---------- */
function renameFlow(type, oldName) {
  const inp = h('input', { class: 'field', value: type === 'tag' ? oldName : oldName, autocapitalize: type === 'tag' ? 'off' : 'words', autocorrect: 'off', style: 'background:var(--s2)' });
  openSheet(type === 'tag' ? 'Rename tag' : 'Rename creator', h('div', null, inp,
    h('div', { class: 'hint', style: 'margin-bottom:14px' }, 'If the new name already exists, the two are merged.'),
    h('button', { class: 'btn wide', style: 'margin-top:0', onclick: async () => {
      const nv = type === 'tag' ? tagNorm(inp.value) : norm(inp.value);
      if (!nv) return;
      await renameAll(type, oldName, nv);
      closeSheet();
      filters = filters.map(f => f.type === type && (type === 'tag' ? tagNorm(f.value) === tagNorm(oldName) : key(f.value) === key(oldName)) ? { type, value: nv } : f);
      render(); toast('Renamed');
    } }, 'Save'),
    h('button', { class: 'btn sec wide', style: 'margin-top:10px;color:var(--heart)', onclick: () => {
      closeSheet();
      setTimeout(() => confirmSheet(`Remove ${type === 'tag' ? '#' + oldName : oldName}?`, `It will be removed from every post. The posts themselves stay.`, 'Remove', async () => {
        await renameAll(type, oldName, null);
        filters = filters.filter(f => !(f.type === type && (type === 'tag' ? tagNorm(f.value) === tagNorm(oldName) : key(f.value) === key(oldName))));
        render(); toast('Removed');
      }), 300);
    } }, type === 'tag' ? 'Remove tag from all posts' : 'Remove creator from all posts')));
}
async function renameAll(type, oldName, newName) {
  const field = type === 'tag' ? 'tags' : 'creators';
  const k = type === 'tag' ? tagNorm : key;
  for (const p of posts) {
    if (!p[field].some(v => k(v) === k(oldName))) continue;
    let arr = p[field].map(v => k(v) === k(oldName) ? newName : v).filter(Boolean);
    const seen = new Set(); arr = arr.filter(v => { const kk = k(v); if (seen.has(kk)) return false; seen.add(kk); return true; });
    p[field] = arr;
    await savePost(p);
  }
}

/* ---------- settings ---------- */
async function openSettings() {
  const body = h('div', { class: 'pbody' });
  const page = h('div', null,
    h('div', { class: 'ptop' }, h('button', { class: 'ibtn', html: I.back, onclick: () => closePage('settings') }), h('h2', null, 'Settings'), h('div', { style: 'width:40px' })),
    body);
  openPage('settings', page);

  const lockLabel = s => s === 0 ? 'Immediately' : s === 60 ? 'After 1 minute' : 'After 5 minutes';
  const lockVal = h('span', { class: 'val' }, lockLabel(settings.lockDelay));
  body.append(
    h('div', { class: 'lbl', style: 'margin-top:4px' }, 'Security'),
    h('div', { class: 'card' },
      h('button', { class: 'row', onclick: changePin }, h('div', { class: 'grow' }, 'Change passcode')),
      h('button', { class: 'row', onclick: () => {
        const o = (s) => h('button', { class: 'opt' + (settings.lockDelay === s ? ' sel' : ''), onclick: () => { settings.lockDelay = s; saveSettings(); lockVal.textContent = lockLabel(s); closeSheet(); } }, h('div', { class: 't' }, lockLabel(s)), h('div', { class: 'rad' }));
        openSheet('Lock when I leave the app', h('div', null, o(0), o(60), o(300)));
      } }, h('div', { class: 'grow' }, 'Auto-lock'), lockVal),
      h('button', { class: 'row', onclick: () => lockNow() }, h('div', { class: 'grow' }, 'Lock now'))),
    h('div', { class: 'hint' }, 'Everything in Folio is encrypted with your passcode (AES-256). X content always hides again when the app locks.'),

    h('div', { class: 'lbl' }, 'Backup'),
    h('div', { class: 'card' },
      h('button', { class: 'row', onclick: exportBackup }, h('div', { class: 'grow' }, h('div', null, 'Export backup'), h('div', { class: 'sub' }, 'Encrypted. Save it to Files, iCloud Drive or a computer'))),
      h('button', { class: 'row', onclick: importBackup }, h('div', { class: 'grow' }, h('div', null, 'Restore from backup'), h('div', { class: 'sub' }, 'Pick one or more .folio files')))),

    h('div', { class: 'lbl' }, 'Creators & tags'),
    h('div', { class: 'card' },
      h('button', { class: 'row', onclick: () => manageList('creator') }, h('div', { class: 'grow' }, 'Manage creators'), h('span', { class: 'val' }, String(indexOf('creator').length))),
      h('button', { class: 'row', onclick: () => manageList('tag') }, h('div', { class: 'grow' }, 'Manage tags'), h('span', { class: 'val' }, String(indexOf('tag').length)))),
  );

  const storageCard = h('div', { class: 'card' });
  body.append(h('div', { class: 'lbl' }, 'Storage'), storageCard, h('div', { class: 'hint' }, `Folio ${VERSION} · Everything is stored only on this phone, inside this app. Deleting the app from your Home Screen deletes its data, so keep a backup.`));
  let used = 0, quota = 0, persisted = false;
  try { const e = await navigator.storage.estimate(); used = e.usage || 0; quota = e.quota || 0; } catch {}
  try { persisted = await navigator.storage.persisted(); } catch {}
  const all = posts.reduce((a, p) => a + p.items.length, 0);
  storageCard.append(
    h('div', { class: 'row' }, h('div', { class: 'grow' }, 'Posts'), h('span', { class: 'val' }, `${posts.length} · ${all} files`)),
    h('div', { class: 'row' }, h('div', { class: 'grow' }, 'Space used'), h('span', { class: 'val' }, fmtBytes(used) + (quota ? ` of ${fmtBytes(quota)}` : ''))),
    h('button', { class: 'row', onclick: async () => {
      let ok = false; try { ok = await navigator.storage.persist(); } catch {}
      toast(ok ? 'Storage is protected' : 'iOS didn’t allow it. Keep the app on your Home Screen and back up regularly');
      if (ok) closePage('settings'), openSettings();
    } }, h('div', { class: 'grow' }, h('div', null, 'Protected storage'), h('div', { class: 'sub' }, 'Asks iOS not to clear Folio’s data')), h('span', { class: 'val', style: persisted ? 'color:var(--ok)' : '' }, persisted ? 'On' : 'Off')));
}

async function changePin() {
  if (!(await askPass('Current passcode', true, () => {}))) return;
  createPass({ title: 'New passcode', over: true, onCancel: () => {}, onDone: async (v, kind) => {
    // only the wrapped key changes; the library itself stays as it is
    keyRec = { ...(await wrapDK(DK, v)), kid: keyRec.kid, kind, len: kind === 'pin' ? v.length : 0 };
    await DB.put('meta', keyRec, 'key');
    toast('Passcode changed. Older backups still need the old one');
  } });
}

function manageList(type) {
  // full list (including X) — requires X visible? show only visible names to avoid leaking
  const list = indexOf(type);
  const body = h('div');
  if (!list.length) body.append(h('div', { style: 'color:var(--muted);text-align:center;padding:10px 0 20px' }, 'Nothing yet.'));
  list.forEach(it => body.append(h('button', { class: 'res', onclick: () => { closeSheet(); setTimeout(() => renameFlow(type, it.name), 300); } },
    type === 'tag' ? h('div', { class: 'rtag' }, '#') : h('div', { class: 'mini' }, initial(it.name)),
    h('div', null, h('div', { class: 'n' }, type === 'tag' ? '#' + it.name : it.name), h('div', { class: 'c2' }, `${it.count} post${it.count > 1 ? 's' : ''} · tap to rename`)))));
  if (xMode === 'off') body.append(h('div', { class: 'hint', style: 'text-align:center' }, 'Names used only on X posts appear when X is on.'));
  openSheet(type === 'tag' ? 'Tags' : 'Creators', body);
}

/* ---------- backup ----------
   File format (.folio v2): 16 ASCII digits = header length, then a JSON header, then the
   encrypted records exactly as stored. Nothing is decrypted to make a backup, so a backup
   can only be restored with the passcode Folio had when it was made.
   Large libraries are split into parts of about 1.5 GB so iPhone can save them. */
const PART_MAX = 1.5 * 1024 ** 3;
async function exportBackup() {
  busyOps++;
  const prog = progress('Preparing backup…');
  try {
    const groups = [];
    for (const p of posts) {
      const ents = []; let size = 0;
      const add = (s, k, blob) => { if (blob) { ents.push({ s, k, blob }); size += blob.size; } };
      const rec = await DB.get('posts', p.id);
      add('posts', p.id, rec && rec.d);
      for (const it of p.items) {
        add('thumbs', it.id, await DB.get('thumbs', it.id));
        for (let i = 0; i < (it.n || 1); i++) add('media', `${it.id}/${i}`, await DB.get('media', `${it.id}/${i}`));
      }
      groups.push({ ents, size });
    }
    const parts = []; let cur = { groups: [], size: 0 };
    for (const g of groups) {
      if (cur.groups.length && cur.size + g.size > PART_MAX) { parts.push(cur); cur = { groups: [], size: 0 }; }
      cur.groups.push(g); cur.size += g.size;
    }
    parts.push(cur);
    const stamp = today();
    const files = parts.map((part, i) => {
      let off = 0; const index = [], blobs = [];
      for (const g of part.groups) for (const e of g.ents) { index.push({ s: e.s, k: e.k, offset: off, size: e.blob.size }); blobs.push(e.blob); off += e.blob.size; }
      const hb = enc.encode(JSON.stringify({ app: 'folio', v: 2, part: i + 1, of: parts.length, created: Date.now(), key: keyRec, files: index }));
      const name = `Folio-backup-${stamp}` + (parts.length > 1 ? `-part${i + 1}of${parts.length}` : '') + '.folio';
      return { name, blob: new Blob([String(hb.length).padStart(16, '0'), hb, ...blobs], { type: 'application/octet-stream' }) };
    });
    prog.close();
    const body = h('div', null, h('div', { style: 'color:var(--muted);text-align:center;margin:-6px 6px 14px;font-size:14px' },
      (files.length > 1 ? `Your library is split into ${files.length} files. Save each one (choose “Save to Files”).` : 'Tap Save, then choose “Save to Files”.') +
      ' The backup is encrypted. Restoring it needs your current passcode.'));
    files.forEach(f => {
      const row = h('div', { class: 'opt', style: 'cursor:default' },
        h('div', { style: 'flex:1;min-width:0' }, h('div', { class: 't', style: 'word-break:break-all;font-size:13px' }, f.name), h('div', { class: 'd' }, fmtBytes(f.blob.size))));
      const btn = h('button', { class: 'btn', style: 'margin:0;height:36px;padding:0 14px;flex:none' }, 'Save');
      btn.onclick = async () => {
        const file = new File([f.blob], f.name, { type: 'application/octet-stream' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); btn.textContent = 'Saved ✓'; return; }
        } catch (e) { if (e && e.name === 'AbortError') return; }
        const a = h('a', { href: URL.createObjectURL(f.blob), download: f.name }); document.body.append(a); a.click(); a.remove();
        btn.textContent = 'Saved ✓';
      };
      row.append(btn); body.append(row);
    });
    openSheet('Backup ready', body);
  } catch (e) { prog.close(); toast('Backup failed: ' + (e.message || e)); }
  finally { busyOps--; checkPendingLock(); }
}

function askBackupPass(rec) {
  return new Promise(resolve => passPrompt({
    kind: rec.kind, len: rec.len, min: rec.kind === 'pass' ? 1 : 6, over: true,
    title: 'Backup passcode', sub: 'Enter the passcode Folio had when this backup was made',
    onCancel: () => resolve(null),
    onSubmit: async v => { const k = await unwrapDK(rec, v); if (k) { resolve(k); return true; } return 'Wrong passcode'; }
  }));
}

function importBackup() {
  const inp = $('#backupPick'); inp.value = '';
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    busyOps++;
    const prog = progress('Restoring…');
    const keys = {}; let restored = 0;
    try {
      for (let fi = 0; fi < files.length; fi++) {
        const f = files[fi];
        const len = parseInt(await f.slice(0, 16).text(), 10);
        if (!len) throw new Error(`${f.name} isn’t a Folio backup`);
        const header = JSON.parse(await f.slice(16, 16 + len).text());
        if (header.app !== 'folio') throw new Error(`${f.name} isn’t a Folio backup`);
        if (header.v !== 2 || !header.key) throw new Error(`${f.name} is from an older Folio version`);
        // same library key: copy records as they are. Different key: decrypt with the backup's key, re-encrypt with ours.
        const same = header.key.kid === keyRec.kid;
        let bk = null;
        if (!same) {
          bk = keys[header.key.kid];
          if (!bk) {
            prog.hide(); bk = await askBackupPass(header.key); prog.show();
            if (!bk) throw new Error('cancelled');
            keys[header.key.kid] = bk;
          }
        }
        const base = 16 + len;
        let n = 0;
        for (const e of header.files) {
          prog.set(n / header.files.length, `File ${fi + 1} of ${files.length} · ${n + 1}/${header.files.length}`);
          let blob = f.slice(base + e.offset, base + e.offset + e.size);
          if (!same) blob = await sealBlob(await openBlob(blob, bk));
          if (e.s === 'posts') { await DB.put('posts', { id: e.k, d: blob }); restored++; }
          else if (e.s === 'media' || e.s === 'thumbs') await DB.put(e.s, blob, e.k);
          n++;
        }
      }
      prog.close();
    } catch (e) {
      prog.close();
      if (e.message !== 'cancelled') toast('Restore failed: ' + (e.message || e));
    } finally {
      for (const u of thumbURL.values()) URL.revokeObjectURL(u);
      thumbURL.clear();
      if (DK) posts = await loadPosts();
      busyOps--;
      if (restored) { closePage('settings'); toast(`Restored ${restored} post${restored === 1 ? '' : 's'}`); }
      render();
      checkPendingLock();
    }
  };
  inp.click();
}

/* ---------- boot ---------- */
async function boot() {
  $('#searchBtn').innerHTML = I.search;
  $('#addBtn').innerHTML = I.plus;
  $('#menuBtn').innerHTML = I.menu;
  $('#xbtn').onclick = openXMenu;
  $('#searchBtn').onclick = openSearch;
  $('#addBtn').onclick = () => openEditor();
  $('#menuBtn').onclick = openSettings;
  $('#brand').onclick = () => { filters = []; favOnly = false; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  if (!window.crypto || !crypto.subtle) {
    document.body.append(h('div', { class: 'empty' }, h('h4', null, 'Secure connection needed'), h('div', null, 'Open Folio from its https:// address.')));
    return;
  }
  try {
    await DB.open();
  } catch (e) {
    document.body.append(h('div', { class: 'empty' }, h('h4', null, 'Storage unavailable'), h('div', null, 'Open Folio from your Home Screen (not a private Safari tab).')));
    return;
  }
  settings = { ...settings, ...(await DB.get('meta', 'settings') || {}) };
  fails = (await DB.get('meta', 'fails')) || fails;
  showLock();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
